meta:
  human_name: memory_F0_only_mid_no_memory
  description: >
    C4 mechanism ablation — F0 refinement HAS memory (gate_f0 controls both residual
    and F0-level memory, same as v3), but coarse and F1 memory are permanently disabled
    (gate_mem_coarse and gate_mem_f1 have warmup_start=999, never activated).
    Purpose: test whether memory helps more at mid/F1 scale vs fine/F0 scale.
    If C4 ≈ v3: F0-level memory is the key; coarse/F1 memory is marginal.
    If C4 << v3: multi-scale memory is necessary; no single level dominates.

dataset:
  name: monuseg
  root_or_name: RationAI/MoNuSeg
  train_split: train
  eval_split: test
  resize_before_sam:
    height: 512
    width: 512
  augmentation_policy: autosam_dense_v1

sam:
  model_id: facebook/sam3
  frozen: true
  use_prompt_encoder: false
  use_mask_decoder: false

training:
  total_epochs: 80
  eval_every: 5
  lr: 1.0e-4
  lr_min: 1.0e-6
  weight_decay: 1.0e-4
  lr_schedule: cosine

evaluation:
  split: test
  threshold: 0.5

guards:
  fail_if_sam_trainable: true
  fail_if_prompt_encoder_used: true
  fail_if_mask_decoder_used: true

model:
  variant: gated_all_refine_mem
  decoder_dim: 128
  memory_tokens: 4
  alpha_init: 0.05

warmup:
  gates:
    gate_mem_coarse:
      # warmup_start=999 → gate permanently 0 (coarse memory never active)
      warmup_start: 999
      warmup_end: 999
    gate_mem_f1:
      # warmup_start=999 → gate permanently 0 (F1 memory never active)
      warmup_start: 999
      warmup_end: 999
    gate_f0:
      warmup_start: 21
      warmup_end: 30
