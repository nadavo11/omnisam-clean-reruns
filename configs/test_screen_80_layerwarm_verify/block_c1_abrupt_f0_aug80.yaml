meta:
  human_name: all_refine_mem_abrupt_F0_no_gate
  description: >
    C1 mechanism ablation — same all-refine-memory architecture as v3 (batch-4 winner),
    but F0 branch activated abruptly at epoch 21 (step 0→1, no linear ramp).
    Implemented by setting warmup_start == warmup_end for gate_f0 — _gate_value
    returns 1.0 as soon as epoch >= warmup_start, 0.0 before.
    Purpose: test whether smooth F0 ramp (vs abrupt switch) matters.
    Coarse and F1 memory warmup unchanged from v3.

dataset:
  name: monuseg
  root_or_name: RationAI/MoNuSeg
  train_split: train
  eval_split: test
  resize_before_sam:
    height: 512
    width: 512
  augmentation_policy: autosam_dense_v1

sam:
  model_id: facebook/sam3
  frozen: true
  use_prompt_encoder: false
  use_mask_decoder: false

training:
  total_epochs: 80
  eval_every: 5
  lr: 1.0e-4
  lr_min: 1.0e-6
  weight_decay: 1.0e-4
  lr_schedule: cosine

evaluation:
  split: test
  threshold: 0.5

guards:
  fail_if_sam_trainable: true
  fail_if_prompt_encoder_used: true
  fail_if_mask_decoder_used: true

model:
  variant: gated_all_refine_mem
  decoder_dim: 128
  memory_tokens: 4
  alpha_init: 0.05

warmup:
  gates:
    gate_mem_coarse:
      warmup_start: 6
      warmup_end: 10
    gate_mem_f1:
      warmup_start: 6
      warmup_end: 15
    gate_f0:
      # warmup_start == warmup_end → abrupt step at epoch 21
      warmup_start: 21
      warmup_end: 21
