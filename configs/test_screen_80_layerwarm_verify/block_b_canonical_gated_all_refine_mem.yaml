meta:
  human_name: official_candidate_gated_all_refine_mem_F0_aug80_canonical
  description: >
    Block B canonical paper-safe rerun of the v3 winning architecture.
    Same config as v3 all_refinement_layers_memory_aug80.
    Purpose: obtain first paper-safe MoNuSeg numbers with explicit backend audit,
    persistent checkpoints, and provenance sidecar.
    training script will record backbone_backend and paper_headline_safe flags.

dataset:
  name: monuseg
  root_or_name: RationAI/MoNuSeg
  train_split: train
  eval_split: test
  resize_before_sam:
    height: 512
    width: 512
  augmentation_policy: autosam_dense_v1

sam:
  model_id: facebook/sam3
  frozen: true
  use_prompt_encoder: false
  use_mask_decoder: false

training:
  total_epochs: 80
  eval_every: 5
  lr: 1.0e-4
  lr_min: 1.0e-6
  weight_decay: 1.0e-4
  lr_schedule: cosine

evaluation:
  split: test
  threshold: 0.5

guards:
  fail_if_sam_trainable: true
  fail_if_prompt_encoder_used: true
  fail_if_mask_decoder_used: true

model:
  variant: gated_all_refine_mem
  decoder_dim: 128
  memory_tokens: 4
  alpha_init: 0.05

warmup:
  gates:
    gate_mem_coarse:
      warmup_start: 6
      warmup_end: 10
    gate_mem_f1:
      warmup_start: 6
      warmup_end: 15
    gate_f0:
      warmup_start: 21
      warmup_end: 30
