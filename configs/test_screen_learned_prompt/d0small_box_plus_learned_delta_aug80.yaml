dataset:
  name: monuseg
  root_or_name: RationAI/MoNuSeg
  train_split: train
  train_selection_policy: hf_train_all_37_includes_tissue_0_unknown
  eval_split: test
  resize_before_sam:
    height: 512
    width: 512
  augmentation_policy: autosam_dense_v1

sam:
  model_id: facebook/sam3
  frozen: true
  use_prompt_encoder: false
  use_mask_decoder: true
  include_decoder_semantic_map: true
  decoder_prompt_mode: full_image_box
  decoder_semantic_map_source: segmentation_head.pixel_decoder

prompt:
  mode: fixed_full_image_box_plus_learned_delta
  box: [0.5, 0.5, 1.0, 1.0]
  positive: true

feature_control:
  mode: none

training:
  stage1_epochs: 80
  stage2_epochs: 0
  lr: 1.0e-4
  lr_min: 1.0e-6
  weight_decay: 1.0e-4
  lr_schedule: cosine

evaluation:
  split: test
  threshold: 0.5
  eval_every: 5

logging:
  visual_every: 80
  log_visuals_to_wandb: true

guards:
  fail_if_sam_trainable: true
  fail_if_prompt_encoder_used: true
  fail_if_mask_decoder_used: false

model:
  variant: d0_small_head
  decoder_dim: 128
  human_name: D0small_box_plus_learned_delta_aug80
