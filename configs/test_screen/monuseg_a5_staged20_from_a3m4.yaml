dataset:
  name: monuseg
  root_or_name: RationAI/MoNuSeg
  train_split: train
  eval_split: test
  resize_before_sam:
    height: 512
    width: 512
  augmentation_policy: none

sam:
  model_id: facebook/sam3
  frozen: true
  use_prompt_encoder: false
  use_mask_decoder: false

training:
  stage1_epochs: 20   # A3M4 trained alone (F0 disabled) — transition near observed A3 peak
  stage2_epochs: 20   # F0 residual enabled, joint training
  lr: 1.0e-4
  weight_decay: 1.0e-4
  lr_schedule: constant

evaluation:
  split: test
  threshold: 0.5

guards:
  fail_if_sam_trainable: true
  fail_if_prompt_encoder_used: true
  fail_if_mask_decoder_used: true

model:
  variant: final_staged
  decoder_dim: 128
  memory_tokens: 4
  alpha_init: 0.05
  final_layer_zero_init: true
