dataset:
  name: monuseg
  root_or_name: RationAI/MoNuSeg
  train_split: train
  train_selection_policy: hf_train_all_37_includes_tissue_0_unknown
  eval_split: test
  resize_before_sam:
    height: 512
    width: 512
  augmentation_policy: autosam_dense_v1

sam:
  model_id: facebook/sam3
  frozen: true
  use_prompt_encoder: false
  use_mask_decoder: true
  include_decoder_semantic_map: true
  decoder_prompt_mode: full_image_box

training:
  stage1_epochs: 160
  stage2_epochs: 0
  lr: 1.0e-4
  lr_min: 1.0e-6
  weight_decay: 1.0e-4
  lr_schedule: cosine

evaluation:
  split: test
  threshold: 0.5
  eval_every: 10

logging:
  visual_every: 10
  log_visuals_to_wandb: true

guards:
  fail_if_sam_trainable: true
  fail_if_prompt_encoder_used: true
  fail_if_mask_decoder_used: false

model:
  variant: d0fpn_cap160_wide_fusion_dim256
  variant_label: Wide D0+FPN fusion dim256
  decoder_dim: 256
  projection_dim: 128

